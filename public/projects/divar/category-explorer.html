<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کشف دسته‌های دیوار</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#c9141e;color:#262323;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffb82e;outline-offset:4px}svg{display:block}button{color:inherit}.stage{padding:clamp(22px,5vw,64px);background:radial-gradient(ellipse at 15% 10%,#ed2731,transparent 58%),#c9141e}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px;color:white;margin-bottom:28px}.intro h2{font-size:clamp(24px,3.5vw,38px);letter-spacing:-1px;line-height:1.5;margin:0}.intro p{font-size:12px;line-height:1.9;margin:8px 0 0;color:#ffe4e4}.sample{font-size:10px;border:1px solid #ffffff70;padding:8px 12px;white-space:nowrap}.app{padding:clamp(18px,3vw,34px);background:#fff;border-radius:24px;box-shadow:0 18px 55px #75050e30}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.topbar h3{font-size:16px;margin:0}.search{display:flex;align-items:center;gap:8px;border:1px solid #e6e1df;border-radius:10px;padding:0 12px;background:#faf9f8;max-width:300px;flex:1}.search input{border:0;background:transparent;padding:12px 0;min-width:0;width:100%;font-size:12px;outline-offset:0}.search svg{width:18px;flex-shrink:0;stroke:#898080;fill:none;stroke-width:1.6}.categories{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;border-bottom:1px solid #eee8e6;padding-bottom:24px}.category{min-width:0;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 3px;border-radius:14px;transition:background .2s,border-color .2s}.category:hover{background:#faf4f2}.category[aria-pressed=true]{background:#fff2ef;border-color:#efc7c1}.icon-tile{display:grid;place-items:center;width:64px;height:64px;max-width:100%;background:#f8f4ef;border-radius:18px;transition:transform .25s}.category:hover .icon-tile{transform:translateY(-4px) rotate(-3deg)}.category[aria-pressed=true] .icon-tile{background:#ffddd3}.icon{width:46px;height:46px}.category-label{font-size:10px;line-height:1.7;white-space:nowrap}.results-heading{display:flex;align-items:center;justify-content:space-between;margin:24px 0 16px;gap:10px}.results-heading h4{margin:0;font-size:15px}.count{font-size:10px;color:#91827c}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.listing{border:1px solid #eee5e1;border-radius:14px;overflow:hidden;min-width:0;background:white}.listing-art{height:124px;background:#f8f3ec;display:grid;place-items:center;position:relative}.listing-art svg{width:76px;height:76px;filter:drop-shadow(0 7px 4px #3520100b)}.listing:nth-child(2) .listing-art{background:#f1f3f6}.listing:nth-child(3) .listing-art{background:#fff4e5}.listing-copy{padding:16px}.listing-copy h5{font-size:12px;line-height:1.8;margin:0 0 10px}.listing-copy p{font-size:11px;margin:0 0 8px}.listing-copy small{font-size:9px;color:#94847e}.save{position:absolute;left:10px;top:10px;width:32px;height:32px;border:1px solid #ffffff;background:#ffffffdc;border-radius:50%;display:grid;place-items:center}.save svg{width:15px;height:15px;fill:none;stroke:#6f6260;stroke-width:1.7;filter:none}.save[aria-pressed=true] svg{fill:#c9141e;stroke:#c9141e}.details{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;border:0;border-top:1px solid #f1e9e5;padding:12px 0 0;background:transparent;color:#b81622;font-size:10px}.empty{grid-column:1/-1;background:#faf6f2;padding:36px;text-align:center;font-size:13px;border-radius:12px}.empty p{color:#91827c;font-size:11px}.reset{border:0;background:#c9141e;color:white;padding:10px 18px;border-radius:8px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #eee8e6;margin-top:22px;padding-top:18px;font-size:10px;color:#9a8a84}.saved-count{color:#a0111b}.toast{font-size:11px;line-height:1.8;color:#fff;margin:16px 0 0;min-height:20px}.defs{position:absolute;width:0;height:0;overflow:hidden}dialog{border:0;border-radius:20px;padding:26px;width:min(420px,calc(100% - 32px));color:#292222;box-shadow:0 16px 80px #28020455}dialog::backdrop{background:#21020688;backdrop-filter:blur(4px)}.dialog-close{border:1px solid #e5dddd;background:white;border-radius:50%;width:32px;height:32px;font-size:18px;float:left}.dialog-art{clear:both;display:grid;place-items:center;background:#faf3eb;padding:25px;border-radius:12px;margin-top:18px}.dialog-art svg{width:96px;height:96px}dialog h3{font-size:18px;margin:20px 0 14px}dialog p{font-size:12px;line-height:2;color:#80706a}.dialog-price{font-size:14px!important;color:#292222!important}.dialog-note{padding-top:12px;border-top:1px solid #eee5e1;font-size:10px!important}.category,.listing{will-change:transform}
@media(max-width:800px){.categories{grid-template-columns:repeat(4,minmax(0,1fr))}.category-label{font-size:10px}.intro{align-items:flex-start}.sample{margin-top:8px}.results{grid-template-columns:repeat(3,minmax(0,1fr))}.listing-copy{padding:12px}}
@media(max-width:480px){.stage{padding:20px 14px}.intro{display:block;margin-bottom:20px}.intro h2{font-size:26px}.sample{display:inline-block;margin-top:12px}.app{border-radius:18px;padding:18px 14px}.topbar{flex-direction:column;align-items:stretch;gap:14px}.search{max-width:none}.categories{gap:5px}.icon-tile{width:48px;height:48px;border-radius:13px}.icon{width:38px;height:38px}.category-label{font-size:10px;white-space:normal}.category{gap:7px;padding:8px 1px}.results{grid-template-columns:1fr}.listing{display:grid;grid-template-columns:94px 1fr}.listing-art{height:100%;min-height:140px}.listing-art svg{width:60px;height:60px}.save{left:5px;top:5px;width:40px;height:40px}.listing-art .save svg{width:15px;height:15px}.listing-copy{padding:14px}.bottom{font-size:10px;gap:8px;align-items:flex-start}.listing-copy h5{font-size:12px}.intro p{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.category:hover .icon-tile{transform:none}}
</style></head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 64 64"><path fill="#f2bd47" d="M8 29 32 8l24 21v27H8z"/><path fill="#d52b36" d="m5 29 27-24 27 24-6 6-21-19-21 19z"/><path fill="#fff7e5" d="M25 37h14v19H25zM14 32h9v9h-9zM41 32h9v9h-9z"/><path stroke="#9d1926" stroke-width="3" d="M8 56h48"/></symbol>
<symbol id="car" viewBox="0 0 64 64"><path fill="#d52b36" d="m13 28 8-13h23l8 13 6 7v16H6V35z"/><path fill="#fee8ac" d="m24 20-5 11h26l-5-11z"/><rect x="8" y="34" width="48" height="11" rx="5" fill="#eb4d53"/><path stroke="#fff2d9" stroke-width="4" d="M11 38h9M44 38h9"/><path stroke="#35353d" stroke-width="7" d="M15 46v9M49 46v9"/></symbol>
<symbol id="digital" viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="34" rx="5" fill="#393942"/><rect x="15" y="15" width="34" height="23" rx="2" fill="#f2bd47"/><path fill="#d52b36" d="m26 21 16 6-16 6z"/><path fill="#b9bdc5" d="M6 46h52l4 7H2z"/><path stroke="#393942" stroke-width="3" d="M25 50h14"/></symbol>
<symbol id="furniture" viewBox="0 0 64 64"><rect x="12" y="15" width="40" height="29" rx="9" fill="#d52b36"/><rect x="16" y="24" width="14" height="15" rx="4" fill="#f2bd47"/><rect x="34" y="24" width="14" height="15" rx="4" fill="#ef6d66"/><rect x="7" y="35" width="50" height="16" rx="5" fill="#bb202b"/><rect x="4" y="29" width="10" height="23" rx="5" fill="#e23d45"/><rect x="50" y="29" width="10" height="23" rx="5" fill="#e23d45"/><path stroke="#393942" stroke-width="4" d="M13 51v7M51 51v7"/></symbol>
<symbol id="fashion" viewBox="0 0 64 64"><path fill="#f2bd47" d="m20 9 12 6 12-6 15 15-10 10-5-5v29H20V29l-5 5L5 24z"/><path stroke="#bf8422" stroke-width="3" fill="none" d="m20 9 12 6 12-6M32 16v38"/><circle cx="36" cy="28" r="2" fill="#d52b36"/><circle cx="36" cy="38" r="2" fill="#d52b36"/></symbol>
<symbol id="beauty" viewBox="0 0 64 64"><rect x="9" y="20" width="27" height="38" rx="7" fill="#f2bd47"/><path fill="#393942" d="M16 9h13v13H16z"/><rect x="15" y="32" width="15" height="13" rx="3" fill="#fff4dd"/><rect x="42" y="26" width="13" height="32" rx="4" fill="#d52b36"/><path fill="#ef8182" d="M45 13h7v18h-7z"/></symbol>
<symbol id="sport" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#ecad37"/><path d="M7 30h50M31 6v52M13 13c24 14 13 36 38 38M51 13C27 27 39 49 13 51" fill="none" stroke="#b82b32" stroke-width="3"/></symbol>
<symbol id="social" viewBox="0 0 64 64"><path fill="#d52b36" d="m20 23 31-13v36L20 36z"/><rect x="7" y="22" width="17" height="15" rx="5" fill="#f2bd47"/><path fill="#393942" d="m14 37 11-1-4 19H12z"/><path stroke="#efad35" stroke-width="4" stroke-linecap="round" d="m56 17 5-4M57 28h5M56 39l5 4"/><path stroke="#fff0d2" stroke-width="4" d="M48 14v28"/></symbol>
<symbol id="headphones" viewBox="0 0 64 64"><path d="M12 37V28a20 20 0 0 1 40 0v9" fill="none" stroke="#efb842" stroke-width="9"/><rect x="6" y="30" width="14" height="25" rx="6" fill="#d52b36"/><rect x="44" y="30" width="14" height="25" rx="6" fill="#d52b36"/><path stroke="#393942" stroke-width="3" d="M19 35v15M45 35v15"/></symbol>
<symbol id="monitor" viewBox="0 0 64 64"><rect x="5" y="8" width="54" height="37" rx="4" fill="#393942"/><rect x="10" y="13" width="44" height="26" rx="2" fill="#f2bd47"/><path fill="#e4625e" d="m10 39 18-20 13 13 13-10v17z"/><path stroke="#9298a2" stroke-width="6" d="M32 44v11M20 57h24"/></symbol>
<symbol id="table" viewBox="0 0 64 64"><ellipse cx="32" cy="23" rx="27" ry="11" fill="#f2bd47"/><path stroke="#393942" stroke-width="5" d="M15 28 10 58M49 28l5 30M32 29v29"/><ellipse cx="32" cy="20" rx="27" ry="10" fill="#f6cf73"/></symbol>
<symbol id="lamp" viewBox="0 0 64 64"><path fill="#f2bd47" d="M21 8h23l9 23H12z"/><path stroke="#393942" stroke-width="5" d="M32 30v25"/><ellipse cx="32" cy="57" rx="17" ry="5" fill="#d52b36"/><ellipse cx="32" cy="31" rx="20" ry="3" fill="#fff1cf"/></symbol></defs></svg>
<main class="stage"><div class="intro"><div><h2>کشف کن. انتخاب کن.</h2><p>از یک دسته شروع کن؛ چیزهای تازه پیدا می‌شوند.</p></div><span class="sample">پیش‌نمایش تعاملی</span></div>
<section class="app" aria-label="مرور دسته‌ها و آگهی‌های نمونه"><div class="topbar"><h3>دنبال چی می‌گردی؟</h3><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><input id="search" type="search" placeholder="جست‌وجو در این دسته" aria-label="جست‌وجو در آگهی‌های نمونه"></label></div><div class="categories" id="categories" aria-label="دسته‌های آگهی"></div><div class="results-heading"><h4 id="category-title"></h4><span class="count" id="count" aria-live="polite"></span></div><div class="results" id="results"></div><div class="bottom"><span>آگهی‌ها برای نمایش این تجربه نمونه‌سازی شده‌اند.</span><span class="saved-count" id="saved-count">۰ نشان‌شده</span></div></section><p id="toast" class="toast" role="status" aria-live="polite">یک دسته را انتخاب کن؛ آگهی‌ها را ببین و نشان کن.</p></main>
<dialog id="detail" aria-labelledby="detail-title"><button class="dialog-close" aria-label="بستن جزئیات">×</button><div id="detail-content"></div></dialog>
<script>
const categories=[{id:'home',name:'املاک',items:[['آپارتمان روشن با بالکن','توافقی','آپارتمان دوخوابه با نور طبیعی و فضای نشیمن باز.'],['خانه‌ای نزدیک پارک','توافقی','خانه‌ای آرام با دسترسی به فضای سبز.'],['استودیوی کوچک و دنج','توافقی','فضایی جمع‌وجور برای شروع تازه.']]},{id:'car',name:'وسایل نقلیه',items:[['خودروی شهری کم‌مصرف','۴۸۰ میلیون تومان','خودرویی جمع‌وجور برای رفت‌وآمد شهری.'],['خودروی خانوادگی','۶۲۰ میلیون تومان','فضای کافی برای سفرها و مسیرهای روزانه.'],['هاچ‌بک قرمز','۵۲۰ میلیون تومان','یک انتخاب کوچک با شخصیت پررنگ.']]},{id:'digital',name:'کالای دیجیتال',items:[['لپ‌تاپ برای کارهای خلاق','۲۸ میلیون تومان','سبک، مناسب طراحی و کارهای روزمره.'],['هدفون بی‌سیم','۳ میلیون تومان','برای تمرکز، موسیقی و تماس‌های روزانه.'],['نمایشگر رومیزی','۸ میلیون تومان','فضای بیشتر برای پروژه بعدی.']]},{id:'furniture',name:'خانه و آشپزخانه',items:[['مبل تک‌نفره قرمز','۶ میلیون تومان','یک نقطه رنگی برای گوشه دنج خانه.'],['میز کنار مبل','۲ میلیون تومان','ساده و جمع‌وجور، برای کتاب و فنجان.'],['چراغ مطالعه','۹۰۰ هزار تومان','نور گرم برای ساعت‌های خواندن.']]},{id:'fashion',name:'مد و پوشاک',items:[['کت پاییزی','۱ میلیون تومان','یک لایه گرم برای روزهای خنک.'],['کیف روزمره','۷۰۰ هزار تومان','همراهی سبک برای وسایل ضروری.'],['پیراهن ساده','۴۵۰ هزار تومان','فرمی ساده برای استفاده روزانه.']]},{id:'beauty',name:'زیبایی و سلامت',items:[['آینه رومیزی','۴۰۰ هزار تومان','آینه‌ای کوچک برای میز شخصی.'],['ست مراقبت','۶۵۰ هزار تومان','یک مجموعه نمونه از وسایل مراقبت.'],['کیف لوازم شخصی','۲۵۰ هزار تومان','برای نظم‌دادن به وسایل کوچک.']]},{id:'sport',name:'ورزش و سرگرمی',items:[['توپ بسکتبال','۸۰۰ هزار تومان','وقت یک بازی تازه است.'],['قمقمه ورزشی','۳۵۰ هزار تومان','همراهی ساده برای مسیر و تمرین.'],['وسایل تمرین','۱ میلیون تومان','برای شروع یک برنامه سبک.']]},{id:'social',name:'اجتماعی',items:[['گروه کتاب‌خوانی','رایگان','هم‌صحبت‌های تازه برای کتاب‌های تازه.'],['دورهمی طراحی','رایگان','گفت‌وگو درباره ایده‌ها و تجربه‌ها.'],['گردش آخر هفته','رایگان','یک برنامه ساده برای کشف شهر.']]}];
const $=id=>document.getElementById(id);const saved=new Set();let active='digital';const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const fa=n=>n.toLocaleString('fa-IR');const icon=id=>'<svg aria-hidden="true" class="icon" viewBox="0 0 64 64"><use href="#'+id+'"/></svg>';const itemIcon=(category,index)=>({digital:['digital','headphones','monitor'],furniture:['furniture','table','lamp']}[category]?.[index]||category);const heart='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20S3 14 3 8a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12Z"/></svg>';
function motion(el,keyframes,options){if(!reduced)el.animate(keyframes,options)}
function renderCategories(){ $('categories').innerHTML=categories.map(c=>'<button type="button" class="category" data-category="'+c.id+'" aria-pressed="'+(active===c.id)+'"><span class="icon-tile">'+icon(c.id)+'</span><span class="category-label">'+c.name+'</span></button>').join(''); }
function render(){const category=categories.find(c=>c.id===active);const query=$('search').value.trim();const items=category.items.map((item,index)=>({item,index})).filter(({item})=>item[0].includes(query));$('category-title').textContent=category.name;$('count').textContent=fa(items.length)+' آگهی نمونه';$('results').innerHTML=items.length?items.map(({item,index})=>{const key=active+'-'+index;return '<article class="listing"><div class="listing-art">'+icon(itemIcon(active,index))+'<button class="save" data-save="'+key+'" aria-label="نشان کردن '+item[0]+'" aria-pressed="'+saved.has(key)+'">'+heart+'</button></div><div class="listing-copy"><h5>'+item[0]+'</h5><p>'+item[1]+'</p><small>تهران · نمونه نمایشی</small><button class="details" data-detail="'+index+'">مشاهده جزئیات <span aria-hidden="true">←</span></button></div></article>';}).join(''):'<div class="empty">چیزی پیدا نشد.<p>یک واژه دیگر امتحان کن یا جست‌وجو را پاک کن.</p><button class="reset" id="reset">پاک کردن جست‌وجو</button></div>';$('saved-count').textContent=fa(saved.size)+' نشان‌شده';document.querySelectorAll('.listing').forEach((el,i)=>motion(el,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:330,delay:i*45,easing:'cubic-bezier(.2,.7,.2,1)',fill:'both'}));}
$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;active=b.dataset.category;$('search').value='';document.querySelectorAll('[data-category]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));motion(b.querySelector('.icon-tile'),[{transform:'scale(.9)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:320});render();$('toast').textContent='حالا در دسته '+categories.find(c=>c.id===active).name+' هستی.';});
$('categories').addEventListener('keydown',e=>{const all=[...document.querySelectorAll('[data-category]')];const index=all.indexOf(e.target);if(index<0||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?all.length-1:(index+(e.key==='ArrowLeft'?1:-1)+all.length)%all.length;all[next].focus();});
$('search').addEventListener('input',render);$('results').addEventListener('click',e=>{const save=e.target.closest('[data-save]');if(save){const key=save.dataset.save;saved.has(key)?saved.delete(key):saved.add(key);save.setAttribute('aria-pressed',String(saved.has(key)));$('saved-count').textContent=fa(saved.size)+' نشان‌شده';$('toast').textContent=saved.has(key)?'آگهی به نشان‌شده‌ها اضافه شد.':'آگهی از نشان‌شده‌ها برداشته شد.';motion(save,[{transform:'scale(.85)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:280});return;}if(e.target.closest('#reset')){$('search').value='';render();$('search').focus();return;}const detail=e.target.closest('[data-detail]');if(detail){const c=categories.find(c=>c.id===active),item=c.items[Number(detail.dataset.detail)];$('detail-content').innerHTML='<div class="dialog-art">'+icon(itemIcon(active,Number(detail.dataset.detail)))+'</div><h3 id="detail-title">'+item[0]+'</h3><p class="dialog-price">'+item[1]+'</p><p>'+item[2]+'</p><p class="dialog-note">این کارت یک نمونه نمایشی است و آگهی واقعی محسوب نمی‌شود.</p>';$('detail').showModal();motion($('detail'),[{opacity:0,transform:'translateY(18px) scale(.97)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:260});}});
$('detail').querySelector('.dialog-close').addEventListener('click',()=>$('detail').close());$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close();}});
renderCategories();render();let heightFrame;function reportHeight(){cancelAnimationFrame(heightFrame);heightFrame=requestAnimationFrame(()=>parent.postMessage({type:'desartly:preview-size',height:Math.ceil(document.querySelector('.stage').getBoundingClientRect().height)},'*'));}new ResizeObserver(reportHeight).observe(document.querySelector('.stage'));window.addEventListener('load',reportHeight);reportHeight();
</script></body></html>
