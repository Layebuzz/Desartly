  <path d="M1120 154c-18 35-39 56-76 74 37 17 58 39 76 74 18-35 39-57 76-74-37-18-58-39-76-74Z" fill="#b191ff"/>
  <circle cx="285" cy="720" r="26" fill="#202632"/>
  <path d="M286 677v86M243 720h86" stroke="#f7f4ee" stroke-width="8" stroke-linecap="round"/>
</svg>
