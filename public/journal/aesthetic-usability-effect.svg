<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">A polished interface surface above a tangled interaction system</title>
  <desc id="desc">An editorial illustration contrasting visual elegance with hidden usability complexity.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#ece7f3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".58" stop-color="#e7e2ff" stop-opacity=".84"/>
      <stop offset="1" stop-color="#b9c5ff" stop-opacity=".72"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="42" stdDeviation="38" flood-color="#202632" flood-opacity=".2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="17" r=".8" fill="#202632" opacity=".1"/>
      <circle cx="52" cy="32" r=".7" fill="#202632" opacity=".08"/>
      <circle cx="31" cy="71" r=".6" fill="#202632" opacity=".08"/>
      <circle cx="82" cy="79" r=".8" fill="#202632" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1440" height="960" fill="url(#paper)"/>
  <rect width="1440" height="960" fill="url(#grain)" opacity=".6"/>
  <ellipse cx="748" cy="755" rx="390" ry="92" fill="#7866ad" opacity=".14" filter="url(#soft)"/>
  <g fill="none" stroke="#242936" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".88">
    <path d="M426 672C520 564 510 808 626 684s93 115 202 3 101 86 197-31"/>
    <path d="M486 742c83-86 125 36 184-38 73-91 117 66 191-28 66-84 127 5 155 45"/>
    <path d="M561 610c-31 87 68 108 126 49 67-68 112 61 183-8 48-47 92-47 131-15"/>
  </g>
  <g fill="#536fee">
    <circle cx="426" cy="672" r="20"/>
    <circle cx="626" cy="684" r="20"/>
    <circle cx="828" cy="687" r="20"/>
    <circle cx="1025" cy="656" r="20"/>
  </g>
  <g transform="rotate(-4 720 430)" filter="url(#shadow)">
    <rect x="315" y="220" width="810" height="430" rx="54" fill="url(#glass)" stroke="#fff" stroke-width="5"/>
    <rect x="372" y="285" width="272" height="300" rx="30" fill="#202632"/>
    <circle cx="421" cy="335" r="13" fill="#b9a2ff"/>
    <rect x="462" y="322" width="120" height="20" rx="10" fill="#fff" opacity=".88"/>
    <rect x="411" y="406" width="194" height="15" rx="7.5" fill="#fff" opacity=".28"/>
    <rect x="411" y="446" width="160" height="15" rx="7.5" fill="#fff" opacity=".28"/>
    <rect x="411" y="486" width="179" height="15" rx="7.5" fill="#fff" opacity=".28"/>
    <rect x="411" y="540" width="98" height="20" rx="10" fill="#8da0ff"/>
    <circle cx="710" cy="319" r="13" fill="#202632"/>
    <rect x="745" y="307" width="260" height="24" rx="12" fill="#202632" opacity=".86"/>
    <rect x="710" y="378" width="340" height="16" rx="8" fill="#202632" opacity=".18"/>
    <rect x="710" y="416" width="294" height="16" rx="8" fill="#202632" opacity=".18"/>
    <rect x="710" y="474" width="150" height="74" rx="22" fill="#536fee"/>
    <rect x="881" y="474" width="169" height="74" rx="22" fill="#fff" stroke="#c7c5ce" stroke-width="3"/>
